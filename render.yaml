# Render Blueprint Specification for AI Interview Simulator
# Documentation: https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # Backend API — FastAPI Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: ai-interview-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: AI Interview Simulator
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-interview-db
          property: connectionString
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-2.5-flash
      - key: AI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://ai-interview-frontend.onrender.com"
      - key: FRONTEND_URL
        value: "https://ai-interview-frontend.onrender.com"
      - key: PASSWORD_RESET_TOKEN_EXPIRE_MINUTES
        value: "30"

  # ---------------------------------------------------------------------------
  # Frontend UI — React + Vite Static Site
  # ---------------------------------------------------------------------------
  - type: web
    name: ai-interview-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://ai-interview-backend.onrender.com/api/v1"

# -----------------------------------------------------------------------------
  # Managed PostgreSQL Database
  # -----------------------------------------------------------------------------
databases:
  - name: ai-interview-db
    databaseName: ai_interview
    user: ai_interview_user
    plan: free

